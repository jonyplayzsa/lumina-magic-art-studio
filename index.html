<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#06050d"><title>Lumina Magic Art Studio</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#06050d;color:#fff;font-family:-apple-system,BlinkMacSystemFont,system-ui,sans-serif}canvas{position:fixed;inset:0;width:100%;height:100%;touch-action:none;-webkit-user-select:none}header{position:fixed;top:0;left:0;right:0;padding:calc(env(safe-area-inset-top) + 10px) 14px 8px;display:flex;align-items:center;justify-content:space-between;pointer-events:none;background:linear-gradient(#080713c9,transparent)}header>*{pointer-events:auto}.brand{font-size:17px;font-weight:850;letter-spacing:.19em}.small{font-size:10px;letter-spacing:.11em;color:#bdb2d8}.toolbar{position:fixed;bottom:calc(env(safe-area-inset-bottom) + 8px);left:8px;right:8px;max-width:850px;margin:auto;background:#151122ed;border:1px solid #ffffff28;box-shadow:0 8px 45px #000a;border-radius:18px;padding:10px;backdrop-filter:blur(18px)}.modes{display:flex;gap:7px;overflow-x:auto;padding:2px 0 9px;scrollbar-width:none}.modes::-webkit-scrollbar{display:none}button{font-family:inherit;touch-action:manipulation;border:1px solid #ffffff2b;background:#29213b;color:#eee8ff;border-radius:10px;padding:9px 11px;font-weight:650;font-size:12px;white-space:nowrap}button.active{background:#7a4dd0;border-color:#d0b4ff;box-shadow:0 0 14px #9464e455}.row{display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin-top:7px}label{font-size:11px;color:#d4c5eb;white-space:nowrap}input{min-width:60px;flex:1;accent-color:#b88cff}#tip{position:fixed;top:36%;width:100%;text-align:center;color:#c6b6de;text-shadow:0 1px 14px #000;pointer-events:none;font-size:14px}#note{font-size:10px;color:#b5a8c8;margin-left:auto}#save{background:#6144a2}@media(max-width:420px){button{padding:8px 9px}.toolbar{padding:8px}.row{gap:6px}}
</style></head><body><canvas id="art"></canvas><header><div><div class="brand">LUMINA</div><div class="small">MAGIC ART STUDIO · BETA</div></div><button id="save">Save PNG</button></header><div id="tip">Drag, hold or swirl your finger to create</div><div class="toolbar"><div class="modes" id="modes"></div><div class="row"><label>Symmetry <b id="sv">8×</b></label><input id="sym" type="range" min="1" max="24" value="8"><label>Detail</label><input id="detail" type="range" min="1" max="10" value="6"></div><div class="row"><button id="palette">Palette: Aurora</button><button id="clear">Clear</button><button id="demo">Surprise me</button><span id="note">Ready</span></div></div><script>
(()=>{'use strict';
const cv=document.getElementById('art'),c=cv.getContext('2d',{alpha:false,desynchronized:true});if(!c)return;
const modes=['Silk','Fluids','Kaleidoscope','Plasma','Fire','Galaxy','Smoke','Ribbons','Fractal','Particles','Marble','Spirograph'];const colors=[{name:'Aurora',h:[182,204,236,276,306,336]},{name:'Rainbow',h:[0,35,60,120,180,225,285,320]},{name:'Sunset',h:[5,20,35,320,290]},{name:'Ocean',h:[160,185,205,235,260]},{name:'Gold',h:[25,35,45,50]}];
let mode=0,palette=0,sym=8,detail=6,W=0,H=0,dpr=1,clock=0,frame=0;const fingers=new Map(),particles=[];const $=id=>document.getElementById(id);const rand=(a,b)=>a+Math.random()*(b-a);
const modebar=$('modes');modes.forEach((m,i)=>{const b=document.createElement('button');b.textContent=m;b.className=i===0?'active':'';b.onclick=()=>{mode=i;modebar.querySelectorAll('button').forEach((el,j)=>el.classList.toggle('active',j===i));$('note').textContent=m+' mode'};modebar.appendChild(b)});
function resize(){let old=document.createElement('canvas');old.width=cv.width;old.height=cv.height;if(old.width)old.getContext('2d').drawImage(cv,0,0);W=innerWidth;H=innerHeight;dpr=Math.min(devicePixelRatio||1,1.8);cv.width=Math.floor(W*dpr);cv.height=Math.floor(H*dpr);c.setTransform(dpr,0,0,dpr,0,0);c.fillStyle='#06050d';c.fillRect(0,0,W,H);if(old.width)c.drawImage(old,0,0,old.width,old.height,0,0,W,H)}addEventListener('resize',resize);resize();
function hue(n=0){const h=colors[palette].h;return h[((Math.floor(clock/80)+n)%h.length+h.length)%h.length]}function ink(h,a,l=65){return 'hsla('+h+',100%,'+l+'%,'+a+')'}
function path(x1,y1,x2,y2,weight,alpha,h,blur=0){c.lineWidth=weight;c.strokeStyle=ink(h,alpha);c.shadowColor=ink(h,.75);c.shadowBlur=blur;c.beginPath();c.moveTo(x1,y1);c.lineTo(x2,y2);c.stroke();c.shadowBlur=0}
function radial(draw,reflected=false){for(let k=0;k<sym;k++){c.save();c.translate(W/2,H/2);c.rotate(k*Math.PI*2/sym);c.translate(-W/2,-H/2);draw(k);if(reflected){c.save();c.translate(W,0);c.scale(-1,1);draw(k);c.restore()}c.restore()}}
function brush(a,b,pressure=1){const dx=b.x-a.x,dy=b.y-a.y,dist=Math.hypot(dx,dy),steps=Math.max(1,Math.min(10,Math.ceil(dist/7))),quality=Math.min(8,Math.max(2,Math.round(detail*.8)));c.save();c.globalCompositeOperation='lighter';c.lineCap='round';for(let s=0;s<steps;s++){const t=s/steps,u=(s+1)/steps,x=a.x+dx*t,y=a.y+dy*t,nx=a.x+dx*u,ny=a.y+dy*u;const ang=Math.atan2(dy,dx),px=-Math.sin(ang),py=Math.cos(ang);
radial(k=>{const h=hue(k+Math.floor(s/3));if(mode===0){for(let j=0;j<quality;j++){const o=(j-(quality-1)/2)*2.6+Math.sin(clock*.05+j*1.2+s*.55)*5;const q=o+Math.sin(clock*.04+j*1.3+s*.5)*2;path(x+px*o,y+py*o,nx+px*q,ny+py*q,3,.12,h,5);path(x+px*o,y+py*o,nx+px*q,ny+py*q,.75,.78,h,0)}}else if(mode===1||mode===10){for(let j=0;j<quality;j++){const off=Math.sin(clock*.025+j*1.6+s*.5)*22+j*2,spread=mode===10?12:5;path(x+px*off,y+py*off,nx+px*(off+spread),ny+py*(off+spread),mode===1?8:5,.15,h,9);path(x+px*off,y+py*off,nx+px*(off+spread),ny+py*(off+spread),2,.3,h)}}else if(mode===2||mode===8||mode===11){const radius=mode===11?Math.sin(clock*.07)*16:mode===8?Math.sin(clock*.035)*26:0;path(x+px*radius,y+py*radius,nx-px*radius,ny-py*radius,2,.78,h,5);if(mode===8||mode===11){path(x-px*radius,y-py*radius,nx+px*radius,ny+py*radius,1,.55,h,2)}}else if(mode===3){for(let j=0;j<4;j++){const off=rand(-13,13),jump=rand(-18,18);path(x+px*off,y+py*off,nx+px*(off+jump),ny+py*(off+jump),j===0?3:.8,j===0?.32:.75,h,9)}}else if(mode===4){for(let j=0;j<quality;j++){const off=rand(-12,12),lift=rand(8,32);path(x+px*off,y+py*off,nx+px*(off+rand(-6,6)),ny+py*(off-lift),rand(1,4),.28,[8,20,35,46][j%4],8)}}else if(mode===5||mode===9){for(let j=0;j<quality;j++){const off=rand(-22,22);path(x+rand(-off,off),y+rand(-off,off),nx+rand(-off,off),ny+rand(-off,off),rand(.5,2),.4,h,8)}}else if(mode===6){for(let j=0;j<quality;j++){const off=Math.sin(clock*.02+j)*18;path(x+px*off,y+py*off,nx+px*(off+rand(-6,6)),ny+py*(off+rand(-6,6)),rand(5,13),.065,h,15)}}else if(mode===7){for(let j=0;j<4;j++){const off=(j-1.5)*8+Math.sin(clock*.05+j)*8;path(x+px*off,y+py*off,nx+px*(off+3),ny+py*(off+3),5,.15,h,10);path(x+px*off,y+py*off,nx+px*(off+3),ny+py*(off+3),1,.8,h)}}},mode===0||mode===2||mode===8||mode===11);
}c.restore();if(particles.length<280){for(let j=0;j<Math.min(2,detail);j++)particles.push({x:b.x,y:b.y,vx:rand(-1.4,1.4),vy:rand(-1.4,1.4),age:0,life:rand(25,70),h:hue(j)})}}
function drawHold(p){const a=p.last||p;const b={x:p.x+Math.sin(clock*.075+p.seed)*1.5,y:p.y+Math.cos(clock*.07+p.seed)*1.5};brush(a,b);p.last={x:b.x,y:b.y}}
function animate(){clock++;frame++;if(frame%3===0){c.fillStyle='rgba(6,5,13,.002)';c.fillRect(0,0,W,H)}for(const p of fingers.values())drawHold(p);c.save();c.globalCompositeOperation='lighter';for(let i=particles.length-1;i>=0;i--){const p=particles[i];p.age++;if(p.age>=p.life){particles.splice(i,1);continue}const ox=p.x,oy=p.y;p.vx+=Math.sin(clock*.03+p.h)*.008;p.vy+=Math.cos(clock*.03+p.h)*.008;if(mode===4)p.vy-=.03;p.x+=p.vx;p.y+=p.vy;const a=(1-p.age/p.life)*.3;radial(()=>path(ox,oy,p.x,p.y,mode===6?3:1,a,p.h,mode===6?7:3))}c.restore();requestAnimationFrame(animate)}requestAnimationFrame(animate);
cv.addEventListener('pointerdown',e=>{e.preventDefault();try{cv.setPointerCapture(e.pointerId)}catch{}const p={x:e.clientX,y:e.clientY,last:{x:e.clientX-.5,y:e.clientY},seed:Math.random()*100};fingers.set(e.pointerId,p);$('tip').style.display='none';$('note').textContent='Drawing';drawHold(p)});
cv.addEventListener('pointermove',e=>{const p=fingers.get(e.pointerId);if(!p)return;e.preventDefault();const x=e.clientX,y=e.clientY;brush({x:p.x,y:p.y},{x,y});p.x=x;p.y=y;p.last={x,y}});
['pointerup','pointercancel','lostpointercapture'].forEach(n=>cv.addEventListener(n,e=>{fingers.delete(e.pointerId);$('note').textContent='Ready'}));
$('sym').oninput=e=>{sym=+e.target.value;$('sv').textContent=sym+'×'};$('detail').oninput=e=>detail=+e.target.value;
$('palette').onclick=e=>{palette=(palette+1)%colors.length;e.target.textContent='Palette: '+colors[palette].name};
$('clear').onclick=()=>{particles.length=0;c.fillStyle='#06050d';c.fillRect(0,0,W,H)};
$('demo').onclick=()=>{let prev=null;$('tip').style.display='none';for(let i=0;i<110;i++){const angle=i*.095,r=i*.9,p={x:W/2+Math.cos(angle)*r,y:H/2+Math.sin(angle)*r};if(prev)brush(prev,p);prev=p}$('note').textContent='Pattern created'};
$('save').onclick=()=>{try{const a=document.createElement('a');a.download='lumina-art.png';a.href=cv.toDataURL('image/png');a.click()}catch{$('note').textContent='Save not supported'}};
})();</script></body></html>
