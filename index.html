<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover"><meta name="theme-color" content="#05040b"><title>Lumina — Magic Art Studio</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#05040b;color:white;font-family:-apple-system,BlinkMacSystemFont,system-ui,sans-serif}canvas{position:fixed;inset:0;width:100%;height:100%;touch-action:none;user-select:none;-webkit-user-select:none}header{position:fixed;top:0;left:0;right:0;padding:calc(env(safe-area-inset-top) + 12px) 15px 12px;display:flex;justify-content:space-between;align-items:center;pointer-events:none;background:linear-gradient(#05040b99,transparent)}header>*{pointer-events:auto}h1{font-size:16px;letter-spacing:.19em;margin:0;font-weight:750}.sub{font-size:10px;color:#b5a8cc;letter-spacing:.13em}.controls{position:fixed;bottom:calc(env(safe-area-inset-bottom) + 10px);left:10px;right:10px;max-width:660px;margin:auto;background:#161222e8;border:1px solid #ffffff26;border-radius:19px;padding:12px;backdrop-filter:blur(16px);box-shadow:0 12px 30px #0009}.row{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-bottom:9px}.row:last-child{margin-bottom:0}button{border:1px solid #ffffff2a;border-radius:10px;background:#2b2440;color:#f8f5ff;padding:9px 11px;font-size:12px;font-weight:600;touch-action:manipulation}button.selected{background:#7650bc;border-color:#c4a5ff}input{min-width:65px;flex:1;accent-color:#bba1ff}label{font-size:11px;color:#d9c8f5}#hint{position:fixed;top:38%;left:0;right:0;text-align:center;color:#c6b8e2;font-size:14px;pointer-events:none;text-shadow:0 2px 12px #000}#status{font-size:11px;color:#a99bbf;margin-left:auto}#toggle{display:none}@media(max-height:600px){.controls{padding:7px}.row{margin-bottom:4px}button{padding:6px 9px}} </style></head><body>
<canvas id="canvas"></canvas><header><div><h1>LUMINA</h1><div class="sub">MAGIC ART STUDIO</div></div><button id="save">Save image</button></header><div id="hint">Touch and drag to paint luminous silk</div>
<section class="controls"><div class="row" id="modes"><button data-mode="silk" class="selected">Silk</button><button data-mode="fire">Fire</button><button data-mode="plasma">Plasma</button><button data-mode="smoke">Smoke</button><button data-mode="galaxy">Galaxy</button><button id="clear" style="margin-left:auto">Clear</button></div>
<div class="row"><label>Symmetry <b id="symval">8×</b></label><input id="sym" type="range" min="2" max="16" step="2" value="8"><label>Detail</label><input id="detail" type="range" min="1" max="10" value="6"></div>
<div class="row"><button id="palette">Colours: Aurora</button><button id="demo">Create pattern</button><span id="status">Ready</span></div></section>
<script>
(()=>{'use strict';
const canvas=document.getElementById('canvas'),ctx=canvas.getContext('2d',{alpha:false,desynchronized:true});if(!ctx){document.getElementById('hint').textContent='Canvas is unavailable';return}
const hint=document.getElementById('hint'),status=document.getElementById('status');let W=0,H=0,dpr=1,sym=8,detail=6,mode='silk',palette=0,phase=0,lastTime=0;
const palettes=[{name:'Aurora',colors:[185,195,210,265,295,330]},{name:'Rainbow',colors:[0,35,60,120,185,245,310]},{name:'Fire',colors:[5,18,30,43]},{name:'Ocean',colors:[170,190,205,225,260]}];const pointers=new Map();const motes=[];const MAX_MOTES=150;
function resize(){const old=document.createElement('canvas');old.width=canvas.width;old.height=canvas.height;if(old.width)old.getContext('2d').drawImage(canvas,0,0);W=window.innerWidth;H=window.innerHeight;dpr=Math.min(devicePixelRatio||1,2);canvas.width=Math.round(W*dpr);canvas.height=Math.round(H*dpr);ctx.setTransform(dpr,0,0,dpr,0,0);ctx.fillStyle='#05040b';ctx.fillRect(0,0,W,H);if(old.width)ctx.drawImage(old,0,0,old.width,old.height,0,0,W,H)}
window.addEventListener('resize',resize);resize();
function coords(e){return{x:e.clientX,y:e.clientY}}function color(i,alpha){const arr=palettes[palette].colors,h=arr[(i+arr.length)%arr.length];return 'hsla('+h+',100%,'+(mode==='fire'?63:73)+'%,'+alpha+')'}
function drawLine(x1,y1,x2,y2,offset,index,width,opacity){const a=index*2*Math.PI/sym,ca=Math.cos(a),sa=Math.sin(a),cx=W/2,cy=H/2;const ax=x1-cx,ay=y1-cy,bx=x2-cx,by=y2-cy;ctx.beginPath();ctx.moveTo(cx+(ax+offset)*ca-ay*sa,cy+(ax+offset)*sa+ay*ca);ctx.lineTo(cx+(bx+offset)*ca-by*sa,cy+(bx+offset)*sa+by*ca);ctx.lineWidth=width;ctx.strokeStyle=color(index+Math.floor(phase/140),opacity);ctx.stroke()}
function stroke(a,b,pressure=1){const dist=Math.hypot(b.x-a.x,b.y-a.y);if(dist<.01)return;const segments=Math.max(1,Math.min(14,Math.ceil(dist/5)));const strands=Math.min(9,Math.max(4,Math.round(detail*.85)));ctx.save();ctx.globalCompositeOperation='lighter';ctx.lineCap='round';for(let step=0;step<segments;step++){const t=step/segments,u=(step+1)/segments;const x1=a.x+(b.x-a.x)*t,y1=a.y+(b.y-a.y)*t,x2=a.x+(b.x-a.x)*u,y2=a.y+(b.y-a.y)*u;for(let j=0;j<strands;j++){const spread=(j-(strands-1)/2)*2.2;const wav=Math.sin(phase*.028+j*1.9+step*.4)*4;const offset=spread+wav;for(let k=0;k<sym;k++){if(j%2===0){drawLine(x1,y1,x2,y2,offset,k,3.8,.10);drawLine(x1,y1,x2,y2,-offset,k,2.4,.09)}drawLine(x1,y1,x2,y2,offset,k,.85,.62);if(j%2===0)drawLine(x1,y1,x2,y2,-offset,k,.6,.48)}}}ctx.restore();if(motes.length<MAX_MOTES){for(let i=0;i<Math.min(2,detail);i++){const angle=Math.random()*6.283;const speed=.25+Math.random()*.8;motes.push({x:b.x,y:b.y,px:b.x,py:b.y,vx:Math.cos(angle)*speed,vy:Math.sin(angle)*speed,life:30+Math.random()*50,age:0,hue:Math.floor(Math.random()*5)})}}}
function tick(t){const dt=Math.min(2,Math.max(.5,(t-lastTime)/16.7||1));lastTime=t;phase+=dt;ctx.save();ctx.globalCompositeOperation='source-over';ctx.fillStyle='rgba(5,4,11,.0005)';ctx.fillRect(0,0,W,H);ctx.globalCompositeOperation='lighter';ctx.lineCap='round';for(let i=motes.length-1;i>=0;i--){const m=motes[i];m.age+=dt;if(m.age>=m.life){motes.splice(i,1);continue}m.px=m.x;m.py=m.y;const curl=Math.sin(m.age*.1+m.hue*1.4)*.017;m.vx+=Math.cos(m.age*.05)*curl;m.vy+=Math.sin(m.age*.05)*curl;if(mode==='fire')m.vy-=.02;if(mode==='galaxy'){m.vx-=(m.y-H/2)*.000015;m.vy+=(m.x-W/2)*.000015}m.x+=m.vx*dt;m.y+=m.vy*dt;const alpha=.28*(1-m.age/m.life);for(let k=0;k<sym;k++)drawLine(m.px,m.py,m.x,m.y,0,k,1.0,alpha)}ctx.restore();requestAnimationFrame(tick)}requestAnimationFrame(tick);
canvas.addEventListener('pointerdown',e=>{e.preventDefault();try{canvas.setPointerCapture(e.pointerId)}catch(_){}const p=coords(e);pointers.set(e.pointerId,p);hint.style.display='none';status.textContent='Drawing';stroke({x:p.x-.8,y:p.y},p)});
canvas.addEventListener('pointermove',e=>{if(!pointers.has(e.pointerId))return;e.preventDefault();const p=coords(e),prev=pointers.get(e.pointerId);stroke(prev,p);pointers.set(e.pointerId,p)});
for(const type of ['pointerup','pointercancel','lostpointercapture'])canvas.addEventListener(type,e=>{pointers.delete(e.pointerId);status.textContent='Ready'});
document.getElementById('modes').addEventListener('click',e=>{const b=e.target.closest('[data-mode]');if(!b)return;mode=b.dataset.mode;document.querySelectorAll('[data-mode]').forEach(el=>el.classList.toggle('selected',el===b))});
document.getElementById('sym').oninput=e=>{sym=+e.target.value;document.getElementById('symval').textContent=sym+'×'};
document.getElementById('detail').oninput=e=>detail=+e.target.value;
document.getElementById('palette').onclick=e=>{palette=(palette+1)%palettes.length;e.target.textContent='Colours: '+palettes[palette].name};
document.getElementById('clear').onclick=()=>{motes.length=0;ctx.fillStyle='#05040b';ctx.fillRect(0,0,W,H)};
document.getElementById('demo').onclick=()=>{hint.style.display='none';let last=null;for(let i=0;i<250;i++){const a=i*.07,r=5+i*.33,p={x:W/2+Math.cos(a)*r,y:H/2+Math.sin(a)*r};if(last)stroke(last,p);last=p}status.textContent='Pattern created'};
document.getElementById('save').onclick=()=>{try{const a=document.createElement('a');a.download='lumina-art.png';a.href=canvas.toDataURL('image/png');a.click()}catch(err){status.textContent='Save unavailable'}};
})();</script></body></html>
