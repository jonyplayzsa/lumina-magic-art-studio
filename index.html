<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#07060d"><title>Lumina Magic Art Studio</title>
<style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#07060d;color:#fff;font-family:system-ui,-apple-system,sans-serif}canvas{position:fixed;inset:0;width:100%;height:100%;touch-action:none;display:block}.top{position:fixed;top:env(safe-area-inset-top,0px);left:0;right:0;display:flex;align-items:center;justify-content:space-between;padding:14px 16px;pointer-events:none}.top>*{pointer-events:auto}.brand{font-size:18px;font-weight:750;letter-spacing:.2em;text-shadow:0 2px 12px #000}.panel{position:fixed;bottom:calc(env(safe-area-inset-bottom,0px) + 12px);left:12px;right:12px;max-width:650px;margin:auto;background:#151324d9;backdrop-filter:blur(18px);border:1px solid #ffffff24;border-radius:20px;padding:12px;box-shadow:0 12px 40px #0008}.row{display:flex;gap:7px;align-items:center;flex-wrap:wrap;margin-bottom:9px}.row:last-child{margin:0}button{border:1px solid #ffffff2c;border-radius:11px;background:#2a2440;color:white;padding:9px 12px;font:600 12px system-ui;touch-action:manipulation}button.active{background:#7250c4;border-color:#a78aff}.grow{flex:1}label{font-size:12px;color:#d4c8f0}input{flex:1;accent-color:#b69bff;min-width:75px}.hint{position:fixed;top:35%;width:100%;text-align:center;color:#bcb0d5;pointer-events:none;text-shadow:0 2px 12px black}.small{font-size:11px;color:#a99cbd}#status{font-size:11px;color:#c5b6e3}</style></head>
<body><canvas id="art"></canvas><div class="top"><div class="brand">LUMINA <span class="small">SILK STUDIO</span></div><button id="save">Save PNG</button></div><div class="hint" id="hint">Touch and move your finger to paint light</div>
<div class="panel"><div class="row" id="modes"><button class="active" data-mode="silk">Silk</button><button data-mode="fire">Fire</button><button data-mode="plasma">Plasma</button><button data-mode="smoke">Smoke</button><button data-mode="galaxy">Galaxy</button><button id="clear" style="margin-left:auto">Clear</button></div><div class="row"><label>Symmetry <b id="symvalue">8×</b></label><input id="sym" type="range" min="2" max="16" step="2" value="8"><label>Flow</label><input id="flow" type="range" min="1" max="100" value="55"></div><div class="row"><button id="palette">Palette: Aurora</button><button id="demo">Make a pattern</button><span id="status" class="grow" style="text-align:right">Ready</span></div></div>
<script>
(()=>{'use strict';const canvas=document.querySelector('#art'),ctx=canvas.getContext('2d',{alpha:false});const hint=document.querySelector('#hint'),status=document.querySelector('#status');let W=0,H=0,D=1,mode='silk',sym=8,flow=55,palette=0,clock=0,active=new Map(),filaments=[];const palettes=[['Aurora',[185,205,270,300,45]],['Rainbow',[5,35,65,135,190,240,300]],['Ember',[5,18,35,45]],['Ocean',[175,195,210,240]]];function resize(){const old=document.createElement('canvas');old.width=canvas.width;old.height=canvas.height;if(old.width)old.getContext('2d').drawImage(canvas,0,0);W=innerWidth;H=innerHeight;D=Math.min(devicePixelRatio||1,2);canvas.width=Math.round(W*D);canvas.height=Math.round(H*D);ctx.setTransform(D,0,0,D,0,0);ctx.fillStyle='#07060d';ctx.fillRect(0,0,W,H);if(old.width)ctx.drawImage(old,0,0,old.width,old.height,0,0,W,H)}addEventListener('resize',resize);resize();
function point(e){return{x:e.clientX,y:e.clientY}}function emit(a,b){const dist=Math.hypot(b.x-a.x,b.y-a.y);const steps=Math.max(1,Math.ceil(dist/3));for(let s=0;s<steps;s++){const t=(s+1)/steps,x=a.x+(b.x-a.x)*t,y=a.y+(b.y-a.y)*t,angle=Math.atan2(b.y-a.y,b.x-a.x);for(let k=0;k<3;k++){const seed=Math.random()*Math.PI*2,spread=(Math.random()-.5)*(12+flow*.35),hues=palettes[palette][1];filaments.push({x:x+Math.cos(angle+Math.PI/2)*spread,y:y+Math.sin(angle+Math.PI/2)*spread,vx:Math.cos(angle)*(.3+Math.random()*.9)+(Math.random()-.5)*.6,vy:Math.sin(angle)*(.3+Math.random()*.9)+(Math.random()-.5)*.6,seed,hue:hues[Math.floor(Math.random()*hues.length)],age:0,life:45+Math.random()*65,width:.25+Math.random()*.8,kind:mode})}}if(filaments.length>1800)filaments.splice(0,filaments.length-1800)}
function transform(x,y,i,mirror){const a=i*Math.PI*2/sym,dx=(mirror?-(x-W/2):x-W/2),dy=y-H/2;return[W/2+dx*Math.cos(a)-dy*Math.sin(a),H/2+dx*Math.sin(a)+dy*Math.cos(a)]}
function segment(p,ox,oy,i,mirror,alpha){const a=transform(ox,oy,i,mirror),b=transform(p.x,p.y,i,mirror);ctx.beginPath();ctx.moveTo(a[0],a[1]);ctx.lineTo(b[0],b[1]);ctx.lineWidth=p.kind==='smoke'?p.width*2.4:p.width;ctx.strokeStyle='hsla('+p.hue+',100%,'+(p.kind==='fire'?60:75)+'%,'+alpha+')';ctx.stroke()}
function frame(){clock++;ctx.globalCompositeOperation='source-over';ctx.fillStyle='rgba(7,6,13,.008)';ctx.fillRect(0,0,W,H);ctx.globalCompositeOperation='lighter';ctx.lineCap='round';for(let j=filaments.length-1;j>=0;j--){const p=filaments[j];if(++p.age>p.life){filaments.splice(j,1);continue}const ox=p.x,oy=p.y,t=p.age;const curl=Math.sin(p.seed+t*.065)*.055*(flow/50);p.vx+=Math.cos(p.seed+t*.045)*curl;p.vy+=Math.sin(p.seed+t*.045)*curl;if(p.kind==='fire')p.vy-=.028;if(p.kind==='galaxy'){p.vx-=(p.y-H/2)*.000016;p.vy+=(p.x-W/2)*.000016}p.vx*=.994;p.vy*=.994;p.x+=p.vx;p.y+=p.vy;const fade=(1-t/p.life),alpha=(p.kind==='smoke'?.04:.17)*fade;for(let i=0;i<sym;i++){segment(p,ox,oy,i,false,alpha);if(p.kind==='silk'||p.kind==='plasma')segment(p,ox,oy,i,true,alpha*.6)}}ctx.globalCompositeOperation='source-over';requestAnimationFrame(frame)}requestAnimationFrame(frame);
canvas.addEventListener('pointerdown',e=>{e.preventDefault();canvas.setPointerCapture(e.pointerId);const p=point(e);active.set(e.pointerId,p);emit({x:p.x-.1,y:p.y-.1},p);hint.style.display='none';status.textContent='Drawing'});canvas.addEventListener('pointermove',e=>{if(!active.has(e.pointerId))return;e.preventDefault();const p=point(e);emit(active.get(e.pointerId),p);active.set(e.pointerId,p)});for(const name of ['pointerup','pointercancel','lostpointercapture'])canvas.addEventListener(name,e=>{active.delete(e.pointerId);status.textContent='Ready'});
document.querySelector('#modes').addEventListener('click',e=>{const b=e.target.closest('[data-mode]');if(!b)return;mode=b.dataset.mode;document.querySelectorAll('[data-mode]').forEach(x=>x.classList.toggle('active',x===b))});document.querySelector('#sym').oninput=e=>{sym=+e.target.value;document.querySelector('#symvalue').textContent=sym+'×'};document.querySelector('#flow').oninput=e=>flow=+e.target.value;document.querySelector('#palette').onclick=e=>{palette=(palette+1)%palettes.length;e.target.textContent='Palette: '+palettes[palette][0]};document.querySelector('#clear').onclick=()=>{filaments=[];ctx.fillStyle='#07060d';ctx.fillRect(0,0,W,H)};document.querySelector('#demo').onclick=()=>{hint.style.display='none';for(let i=0;i<200;i++){const a=i*.085,r=15+i*.42;emit({x:W/2+Math.cos(a)*r,y:H/2+Math.sin(a)*r},{x:W/2+Math.cos(a+.04)*(r+2),y:H/2+Math.sin(a+.04)*(r+2)})}status.textContent='Pattern generated'};document.querySelector('#save').onclick=()=>{const a=document.createElement('a');a.href=canvas.toDataURL('image/png');a.download='lumina-art.png';a.click()};})();
</script></body></html>
